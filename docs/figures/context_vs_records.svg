<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif" role="img" aria-labelledby="t d">
<title id="t">기록 수에 따른 질문당 맥락 크기</title>
<desc id="d">기록이 15개에서 315개로 늘 때 전체 맥락 LLM은 4,078자에서 87,026자로 커지고, BM25 검색은 약 1,600자, 하네스는 약 330자로 일정하다.</desc>
<rect width="960" height="540" fill="#fcfcfb"/>
<text x="96" y="44" font-size="24" font-weight="700" fill="#0b0b0b">기록이 늘어도 하네스의 맥락은 일정하다</text>
<text x="96" y="72" font-size="15" fill="#52514e">질문당 답변 LLM에 넘긴 맥락 크기(글자 수, 로그 축). 세 시스템 모두 같은 답변 모델·프롬프트.</text>
<circle cx="102.0" cy="96.0" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/>
<text x="114" y="101" font-size="14" fill="#52514e">하네스</text>
<rect x="182.0" y="90.0" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/>
<text x="200" y="101" font-size="14" fill="#52514e">전체 맥락 LLM</text>
<polygon points="328.0,89.0 335.0,101.5 321.0,101.5" fill="#1baf7a" stroke-linejoin="round" stroke="#fcfcfb" stroke-width="2"/>
<text x="340" y="101" font-size="14" fill="#52514e">BM25 검색</text>
<line x1="96" x2="750" y1="444.0" y2="444.0" stroke="#e6e5e1" stroke-width="1"/>
<text x="86" y="449.0" font-size="13" fill="#8a8984" text-anchor="end">100</text>
<line x1="96" x2="750" y1="345.2" y2="345.2" stroke="#e6e5e1" stroke-width="1"/>
<text x="86" y="350.2" font-size="13" fill="#8a8984" text-anchor="end">1,000</text>
<line x1="96" x2="750" y1="246.5" y2="246.5" stroke="#e6e5e1" stroke-width="1"/>
<text x="86" y="251.5" font-size="13" fill="#8a8984" text-anchor="end">10,000</text>
<line x1="96" x2="750" y1="147.7" y2="147.7" stroke="#e6e5e1" stroke-width="1"/>
<text x="86" y="152.7" font-size="13" fill="#8a8984" text-anchor="end">100,000</text>
<text x="96.0" y="470" font-size="13" fill="#8a8984" text-anchor="middle">15</text>
<text x="314.0" y="470" font-size="13" fill="#8a8984" text-anchor="middle">115</text>
<text x="750.0" y="470" font-size="13" fill="#8a8984" text-anchor="middle">315</text>
<text x="423.0" y="494" font-size="14" fill="#52514e" text-anchor="middle">팀 기록 수 (원래 15개 + 조건만 다른 방해 기록)</text>
<polyline points="96.0,394.5 314.0,392.8 750.0,392.8" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g><circle cx="96.0" cy="394.5" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><title>하네스 · 기록 15개 · 317자</title></g>
<g><circle cx="314.0" cy="392.8" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><title>하네스 · 기록 115개 · 330자</title></g>
<g><circle cx="750.0" cy="392.8" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><title>하네스 · 기록 315개 · 330자</title></g>
<text x="764.0" y="390.8" font-size="14" font-weight="700" fill="#0b0b0b">330자</text>
<text x="764.0" y="407.8" font-size="12" fill="#52514e">하네스</text>
<polyline points="96.0,285.0 314.0,196.9 750.0,153.7" fill="none" stroke="#eb6834" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g><rect x="90.0" y="279.0" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><title>전체 맥락 LLM · 기록 15개 · 4,078자</title></g>
<g><rect x="308.0" y="190.9" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><title>전체 맥락 LLM · 기록 115개 · 31,801자</title></g>
<g><rect x="744.0" y="147.7" width="12" height="12" rx="2" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><title>전체 맥락 LLM · 기록 315개 · 87,026자</title></g>
<text x="764.0" y="151.7" font-size="14" font-weight="700" fill="#0b0b0b">87,026자</text>
<text x="764.0" y="168.7" font-size="12" fill="#52514e">전체 맥락 LLM</text>
<polyline points="96.0,326.2 314.0,325.8 750.0,324.8" fill="none" stroke="#1baf7a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
<g><polygon points="96.0,319.2 103.0,331.7 89.0,331.7" fill="#1baf7a" stroke-linejoin="round" stroke="#fcfcfb" stroke-width="2"/><title>BM25 검색 · 기록 15개 · 1,558자</title></g>
<g><polygon points="314.0,318.8 321.0,331.3 307.0,331.3" fill="#1baf7a" stroke-linejoin="round" stroke="#fcfcfb" stroke-width="2"/><title>BM25 검색 · 기록 115개 · 1,575자</title></g>
<g><polygon points="750.0,317.8 757.0,330.3 743.0,330.3" fill="#1baf7a" stroke-linejoin="round" stroke="#fcfcfb" stroke-width="2"/><title>BM25 검색 · 기록 315개 · 1,611자</title></g>
<text x="764.0" y="322.8" font-size="14" font-weight="700" fill="#0b0b0b">1,611자</text>
<text x="764.0" y="339.8" font-size="12" fill="#52514e">BM25 검색</text>
<text x="96" y="530" font-size="12" fill="#8a8984">하네스 15개 값은 안내문 상한 수정 전 측정치(수정 영향 미미). 질문 14개 평균.</text>
</svg>